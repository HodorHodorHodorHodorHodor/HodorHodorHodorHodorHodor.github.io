<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michael Kim Games</title>
<meta name="description" content="Simple, colourful puzzle games for all ages.">
<link rel="icon" href="bento-pack/icon.png">
<style>
  :root { --bg:#FFF4E6; --card:#FFFFFF; --text:#5C3D2E; --soft:#8A6A55; --accent:#F0582A; --line:#4A2C20; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 34px; margin: 0 0 4px; text-align:center; }
  .tag { color: var(--soft); text-align:center; margin: 0 0 28px; }
  a.game { display:flex; gap:16px; align-items:center; background:var(--card); border:3px solid var(--line); border-radius:22px; padding:14px 18px; color:inherit; text-decoration:none; }
  a.game img { width:72px; height:72px; border-radius:18px; border:3px solid var(--line); }
  a.game strong { font-size: 21px; }
  a.game span { display:block; color: var(--soft); }
  footer { color: var(--soft); margin-top: 28px; font-size: 15px; text-align:center; }
  footer a { color: #1c7ed6; }
</style>
</head>
<body>
<main>
  <h1>Michael Kim Games</h1>
  <p class="tag">Simple, colourful puzzle games for all ages.</p>
  <a class="game" href="bento-pack/">
    <img src="bento-pack/icon.png" alt="">
    <div><strong>Bento Pack</strong><span>Pack the perfect lunch!</span></div>
  </a>
  <footer>Contact: <a href="mailto:waypointcustomersupport@gmail.com">waypointcustomersupport@gmail.com</a> · © 2026 Michael Kim</footer>
</main>
</body>
</html>
